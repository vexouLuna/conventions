# Build a service's container image, and publish it to GHCR on a push, as job `image` in its ci.yml:
#
#   on:
#     push:
#       branches: [main]        # add dev in a flow = "dev" repo
#       tags: ["v*"]
#     pull_request:
#   jobs:
#     image:
#       needs: ci
#       uses: vexouLuna/conventions/.github/workflows/publish-image.yml@v2.2.0
#       permissions:
#         contents: read
#         packages: write
#
# Its job becomes the required check `image / build`. A pull request builds the image and stops there.
# A push publishes ghcr.io/<owner>/<repo>[-<suffix>] as:
#   :main     from main, what production follows
#   :dev      from dev, what a test box follows
#   :vX.Y.Z   from a release tag, the name to roll back to (the tag must equal the package version)
#   :<sha>    always
name: publish-image

on:
  workflow_call:
    inputs:
      suffix:
        description: Appended to the image name as -<suffix>, for a repo with several images
        type: string
        default: ""
      target:
        description: The Dockerfile stage to build; empty for the last one
        type: string
        default: ""
      version-file:
        description: A file whose `version = "..."` or `__version__ = "..."` line a release tag must match
        type: string
        default: pyproject.toml
      pre-build:
        description: Shell commands run before the build (validating compose files, say); empty to skip
        type: string
        default: ""
      platforms:
        type: string
        default: linux/amd64

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLISH: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Tag matches the package version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
          VERSION_FILE: ${{ inputs.version-file }}
        run: |
          code=$(sed -n 's/^\(__version__\|version\) *= *"\(.*\)"/\2/p' "$VERSION_FILE" | head -n1)
          echo "tag $TAG, $VERSION_FILE $code"
          [ "$TAG" = "v$code" ]
      - name: Pre-build
        if: inputs.pre-build != ''
        run: ${{ inputs.pre-build }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Image tags
        # GHCR rejects an uppercase path, and an owner's login may well have one.
        id: tags
        env:
          SUFFIX: ${{ inputs.suffix }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}${SUFFIX:+-$SUFFIX}"
          case "$REF_TYPE/$REF_NAME" in
            tag/v*) name=$REF_NAME ;;
            branch/dev) name=dev ;;
            *) name=main ;;
          esac
          {
            echo 'list<<TAGS'
            echo "$repo:$name"
            echo "$repo:$GITHUB_SHA"
            echo TAGS
          } >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: ${{ inputs.target }}
          push: ${{ env.PUBLISH == 'true' }}
          platforms: ${{ inputs.platforms }}
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha,scope=${{ inputs.suffix || 'default' }}
          cache-to: type=gha,mode=max,scope=${{ inputs.suffix || 'default' }}
