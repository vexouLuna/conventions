# Claude reviews a pull request and comments on it. Optional: a repo opts in with a job `review` in its
# ci.yml:
#
#   jobs:
#     review:
#       needs: [conventions, ci]   # every other job in ci.yml: no review of a change that fails CI
#       permissions:
#         contents: read
#         pull-requests: read
#         issues: read
#         id-token: write
#       uses: vexouLuna/conventions/.github/workflows/claude-review.yml@v4.1.0
#       secrets:
#         CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
#
# The repo needs the Claude GitHub app (https://github.com/apps/claude), which posts the comments, and
# the secret CLAUDE_CODE_OAUTH_TOKEN, made with `claude setup-token`. `id-token: write` is what the app
# sign-in uses, and a called workflow can't have more permissions than its caller, hence the block.
#
# Off by default. The switch is the repository variable CLAUDE_REVIEW: the review runs only while it is
# `true` (`gh variable set CLAUDE_REVIEW --body true`), and any other value, or none, skips the job.
#
# Sonnet triages the diff first: a simple change is reviewed by Sonnet, a complex or unclear one by Opus.
# The job's summary has a table of the triage, the reason, the model, the result and the cost, and the
# log has the same as one JSON line starting `claude-review-stats`, for statistics.
#
# `review / review` is not a required check: a review is advice, and a run can fail on a usage limit.
name: claude-review

on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: Long-lived Claude Code token from `claude setup-token`; reviews use that subscription
        required: true

permissions:
  contents: read
  pull-requests: read
  issues: read
  id-token: write

jobs:
  review:
    # `vars` is the calling repo's: its variable CLAUDE_REVIEW switches the review on.
    # Only a pull request from a branch of this repo: a fork gets no secrets, so the run would only fail.
    # Bots (Renovate) are skipped: a version bump has nothing to review and would spend usage on every one.
    if: >-
      vars.CLAUDE_REVIEW == 'true'
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Triage: Sonnet reads the diff and says whether the review needs Opus.
      - name: Diff for triage
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        # Capped: triage needs the shape of the change, not every line of a huge one. GitHub refuses a
        # diff that is too large; triage then has nothing to go on, which makes it complex.
        run: |
          gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" > .claude-review.diff \
            || echo "The diff is too large to fetch." > .claude-review.diff
          truncate -s '<300000' .claude-review.diff
      - name: Triage
        id: triage
        # A triage that fails must not stop the review; the next step then picks Opus.
        continue-on-error: true
        uses: anthropics/claude-code-action@6070f08d2b4766348e0acded463606a7b176417b # v1.0.279
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Read the file .claude-review.diff: the diff of a pull request (cut off if very long). Decide
            whether reviewing it needs the stronger model. Do not review it, and do not comment anywhere.

            It is complex if it touches any of:
            1. Sign-in and permissions: sessions, tokens, API keys, role or policy checks, allowed origins.
            2. Data that can be lost: database migrations, schema changes, backup or rotation scripts,
               anything that deletes.
            3. Timing and shared state: async jobs, locks, queues, retries, cooldowns, playback or
               timeline synchronisation.
            4. Contracts other repos depend on: a library's exports, the shape of a JSON API, reusable
               workflows.
            5. Logic spread wide: a behaviour change across three or more modules, or more than about 400
               changed lines of hand-written code.

            Size alone does not count: generated files, lockfiles, docs, styles, copy and tests-only
            changes are simple however long. If you are unsure, it is complex.

            Return complex (boolean) and reason (one sentence).
          claude_args: |
            --model sonnet
            --allowedTools "Read"
            --json-schema '{"type":"object","properties":{"complex":{"type":"boolean"},"reason":{"type":"string"}},"required":["complex","reason"]}'
      - name: Pick the model
        id: model
        # Through the environment, never interpolated into the script: the verdict is model output.
        env:
          VERDICT: ${{ steps.triage.outputs.structured_output }}
          EXECUTION_FILE: ${{ steps.triage.outputs.execution_file }}
        # Sonnet only on a clear "not complex": no verdict, or an unsure one, means Opus.
        # The triage cost is read here because the review step writes its own execution file over it.
        run: |
          rm -f .claude-review.diff
          case "$(jq -r '.complex' <<<"$VERDICT" 2>/dev/null || true)" in
            false) triage=simple model=sonnet ;;
            true) triage=complex model=opus ;;
            *) triage="no verdict" model=opus ;;
          esac
          cost=$(jq -r '.. | .total_cost_usd? // empty' "$EXECUTION_FILE" 2>/dev/null | tail -1 || true)
          { echo "triage=$triage"; echo "model=$model"; echo "cost=${cost:-0}"; } >> "$GITHUB_OUTPUT"

      - name: Review
        id: review
        uses: anthropics/claude-code-action@6070f08d2b4766348e0acded463606a7b176417b # v1.0.279
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: https://github.com/anthropics/claude-plugins-official.git
          plugins: code-review@claude-plugins-official
          prompt: /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}
          # The review's sub-reviewers must run in the foreground: sent to the background, the session
          # could end with them still running, having posted nothing (about a quarter of the first runs).
          settings: '{"env": {"CLAUDE_CODE_DISABLE_BACKGROUND_TASKS": "1"}}'
          # The inline-comment tool only exists when it is allowed here.
          claude_args: --model ${{ steps.model.outputs.model }} --allowedTools "mcp__github_inline_comment__create_inline_comment"

      # What happened, twice: a table in the job summary for people, and one `claude-review-stats` JSON
      # line in the log for statistics (`gh run view --log | grep claude-review-stats`).
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          VERDICT: ${{ steps.triage.outputs.structured_output }}
          TRIAGE: ${{ steps.model.outputs.triage }}
          MODEL: ${{ steps.model.outputs.model }}
          TRIAGE_COST: ${{ steps.model.outputs.cost }}
          CONCLUSION: ${{ steps.review.outputs.conclusion }}
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
        # Never fails the job: a report that can't be written is not a failed review.
        run: |
          set +e
          reason=$(jq -r '.reason // empty' <<<"$VERDICT" 2>/dev/null)
          review_cost=$(jq -r '.. | .total_cost_usd? // empty' "$EXECUTION_FILE" 2>/dev/null | tail -1)
          # How the review ended in Claude's own words: what explains a run that left no comment.
          outcome=$(jq -r '[.. | objects | select(.type? == "result") | .result? | strings] | last // empty' \
            "$EXECUTION_FILE" 2>/dev/null | tr '\n' ' ' | cut -c1-400)
          # Inline comments Claude left on this commit; a re-run of the same commit counts the earlier ones too.
          comments=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/comments?per_page=100" \
            --jq "[.[] | select(.user.login == \"claude[bot]\" and .original_commit_id == \"$SHA\")] | length" 2>/dev/null)
          stats=$(jq -n -c \
            --arg pr "$PR" --arg triage "${TRIAGE:-no verdict}" --arg reason "$reason" --arg model "$MODEL" \
            --arg conclusion "${CONCLUSION:-skipped}" --arg comments "$comments" \
            --arg triage_cost "$TRIAGE_COST" --arg review_cost "$review_cost" --arg outcome "$outcome" \
            '{pr: ($pr | tonumber? // null), triage: $triage, reason: $reason, model: $model,
              conclusion: $conclusion, inline_comments: ($comments | tonumber? // 0), outcome: $outcome,
              triage_cost_usd: ($triage_cost | tonumber? // 0), review_cost_usd: ($review_cost | tonumber? // 0)}
             | .total_cost_usd = (.triage_cost_usd + .review_cost_usd)')
          echo "claude-review-stats $stats"
          # A `|` in the reason would end its table cell.
          jq -r '"| Triage | Why | Model | Result | Cost (API price) |",
                 "|---|---|---|---|---|",
                 "| \(.triage) | \(.reason | split("|") | join("/") | if . == "" then "—" else . end) | \(.model) | \(.conclusion), \(.inline_comments) inline comments | $\(.total_cost_usd * 100 | round / 100) (triage $\(.triage_cost_usd * 100 | round / 100), review $\(.review_cost_usd * 100 | round / 100)) |",
                 (if .outcome != "" then "", "How the review ended: \(.outcome)" else empty end)' \
            <<<"$stats" >> "$GITHUB_STEP_SUMMARY"
          exit 0
