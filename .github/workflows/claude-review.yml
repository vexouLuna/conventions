# Claude reviews a pull request and comments on it. Optional: a repo opts in with a job `review` in its
# ci.yml:
#
#   jobs:
#     review:
#       permissions:
#         contents: read
#         pull-requests: read
#         issues: read
#         id-token: write
#       uses: vexouLuna/conventions/.github/workflows/claude-review.yml@v4.0.0
#       secrets:
#         CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
#
# The repo needs the Claude GitHub app (https://github.com/apps/claude), which posts the comments, and
# the secret CLAUDE_CODE_OAUTH_TOKEN, made with `claude setup-token`. `id-token: write` is what the app
# sign-in uses, and a called workflow can't have more permissions than its caller, hence the block.
#
# Sonnet triages the diff first: a simple change is reviewed by Sonnet, a complex or unclear one by Opus.
# The job's summary says which, and why.
#
# `review / review` is not a required check: a review is advice, and a run can fail on a usage limit.
name: claude-review

on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: Long-lived Claude Code token from `claude setup-token`; reviews use that subscription
        required: true

permissions:
  contents: read
  pull-requests: read
  issues: read
  id-token: write

jobs:
  review:
    # Only a pull request from a branch of this repo: a fork gets no secrets, so the run would only fail.
    # Bots (Renovate) are skipped: a version bump has nothing to review and would spend usage on every one.
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Triage: Sonnet reads the diff and says whether the review needs Opus.
      - name: Diff for triage
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        # Capped: triage needs the shape of the change, not every line of a huge one. GitHub refuses a
        # diff that is too large; triage then has nothing to go on, which makes it complex.
        run: |
          gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" > .claude-review.diff \
            || echo "The diff is too large to fetch." > .claude-review.diff
          truncate -s '<300000' .claude-review.diff
      - name: Triage
        id: triage
        # A triage that fails must not stop the review; the next step then picks Opus.
        continue-on-error: true
        uses: anthropics/claude-code-action@6070f08d2b4766348e0acded463606a7b176417b # v1.0.279
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Read the file .claude-review.diff: the diff of a pull request (cut off if very long). Decide
            whether reviewing it needs the stronger model. Do not review it, and do not comment anywhere.

            It is complex if it touches any of:
            1. Sign-in and permissions: sessions, tokens, API keys, role or policy checks, allowed origins.
            2. Data that can be lost: database migrations, schema changes, backup or rotation scripts,
               anything that deletes.
            3. Timing and shared state: async jobs, locks, queues, retries, cooldowns, playback or
               timeline synchronisation.
            4. Contracts other repos depend on: a library's exports, the shape of a JSON API, reusable
               workflows.
            5. Logic spread wide: a behaviour change across three or more modules, or more than about 400
               changed lines of hand-written code.

            Size alone does not count: generated files, lockfiles, docs, styles, copy and tests-only
            changes are simple however long. If you are unsure, it is complex.

            Return complex (boolean) and reason (one sentence).
          claude_args: |
            --model sonnet
            --allowedTools "Read"
            --json-schema '{"type":"object","properties":{"complex":{"type":"boolean"},"reason":{"type":"string"}},"required":["complex","reason"]}'
      - name: Pick the model
        id: model
        # Through the environment, never interpolated into the script: the verdict is model output.
        env:
          VERDICT: ${{ steps.triage.outputs.structured_output }}
        # Sonnet only on a clear "not complex": no verdict, or an unsure one, means Opus.
        run: |
          rm -f .claude-review.diff
          if [ "$(jq -r '.complex' <<<"$VERDICT" 2>/dev/null)" = "false" ]; then model=sonnet; else model=opus; fi
          echo "model=$model" >> "$GITHUB_OUTPUT"
          reason=$(jq -r '.reason // empty' <<<"$VERDICT" 2>/dev/null || true)
          echo "Review model: $model. ${reason:-No triage verdict.}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Review
        uses: anthropics/claude-code-action@6070f08d2b4766348e0acded463606a7b176417b # v1.0.279
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: https://github.com/anthropics/claude-plugins-official.git
          plugins: code-review@claude-plugins-official
          prompt: /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}
          # The inline-comment tool only exists when it is allowed here.
          claude_args: --model ${{ steps.model.outputs.model }} --allowedTools "mcp__github_inline_comment__create_inline_comment"
