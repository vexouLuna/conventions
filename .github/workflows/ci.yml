# This repo's own CI: the same conventions check and Python CI every repo runs, taken from this
# checkout rather than a released tag, plus shellcheck for the synced hooks.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  conventions:
    uses: ./.github/workflows/conventions-check.yml
    with:
      from: "."
    secrets:
      CONVENTIONS_PRIVATE_PATTERNS: ${{ secrets.CONVENTIONS_PRIVATE_PATTERNS }}

  ci:
    uses: ./.github/workflows/python-ci.yml

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: shellcheck src/conventions/files/common/.conventions/githooks/*
