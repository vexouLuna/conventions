# The conventions check every repo runs, as job `conventions` in its ci.yml:
#
#   jobs:
#     conventions:
#       uses: vexouLuna/conventions/.github/workflows/conventions-check.yml@v3.0.0
#       secrets:
#         CONVENTIONS_PRIVATE_PATTERNS: ${{ secrets.CONVENTIONS_PRIVATE_PATTERNS }}
#
# Its jobs become the required checks `conventions / branch-name`, `conventions / check` and
# `conventions / version`. The tag after @ must be the version in .conventions.toml; `check` fails
# otherwise.
name: conventions

on:
  workflow_call:
    inputs:
      from:
        description: Where to install the conventions CLI from; empty means the version .conventions.toml pins
        type: string
        default: ""
    secrets:
      CONVENTIONS_PRIVATE_PATTERNS:
        description: Extra private-infrastructure patterns, one regular expression per line
        required: false

permissions:
  contents: read

jobs:
  branch-name:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Conventional Branch, and allowed into its base
        # Through the environment, never interpolated into the script: a branch name is user input.
        # Outside a pull request there is no head branch to judge, so this passes, and the check exists
        # on every run, which is what lets it be required.
        if: github.event_name == 'pull_request'
        env:
          HEAD: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
        run: .conventions/githooks/check-pr-branches.sh "$HEAD" "$BASE"

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Synced files, workflows, layout
        env:
          FROM: ${{ inputs.from }}
          PUBLIC: ${{ !github.event.repository.private }}
          CONVENTIONS_PRIVATE_PATTERNS: ${{ secrets.CONVENTIONS_PRIVATE_PATTERNS }}
        run: |
          if [ -z "$FROM" ]; then
            version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' .conventions.toml)
            FROM="git+https://github.com/vexouLuna/conventions@$version"
          fi
          args=()
          if [ "$PUBLIC" = "true" ]; then args+=(--public); fi
          uvx --python 3.13 --from "$FROM" conventions check "${args[@]}"

  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The base branch and the tags, for comparing a release with main.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Version files agree; a release into main raises the version
        # Every run checks that the files carrying the version agree. A pull request into main also has to
        # raise it above main's and use a tag that doesn't exist yet, in a flow = "dev" repo, where such a
        # pull request is a release. A repo with no version passes.
        env:
          FROM: ${{ inputs.from }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ -z "$FROM" ]; then
            version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' .conventions.toml)
            FROM="git+https://github.com/vexouLuna/conventions@$version"
          fi
          args=()
          if [ "$EVENT" = "pull_request" ] && [ "$BASE" = "main" ]; then args+=(--against "origin/$BASE"); fi
          uvx --python 3.13 --from "$FROM" conventions version check "${args[@]}"
